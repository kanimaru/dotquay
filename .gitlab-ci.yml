# GitLab CI for dotquay (SPEC.md §12: NativeAOT self-contained single-file publish, win-x64 +
# linux-x64; §16 OQ-6: "trimmed self-contained publish only as fallback" where real NativeAOT
# compilation for the target isn't available).
#
# Runner reality (confirmed from a real pipeline run 2026-08-22): this GitLab instance's runner
# (`docker@kemomi.de`) is Docker-executor-only, backed by a Linux host — there is no native
# Windows machine to build on. Native AOT compilation is NOT cross-OS: producing a real win-x64
# native binary requires an actual Windows toolchain (the MSVC/Windows SDK linker), which doesn't
# exist inside a Linux container. So:
#
#   - `build:linux-x64` publishes a genuine NativeAOT binary — host OS == target OS, this is the
#     fully-supported, already-verified-elsewhere path (see docs/SPRINT-01.md's "AOT verdict"
#     sections).
#   - `build:windows-x64` falls back to a trimmed, self-contained, single-file publish
#     (`PublishAot=false`, explicitly overriding the csproj's default) instead of NativeAOT. This
#     is still a fully self-contained single .exe with no separate runtime install needed — just
#     not natively compiled — and it's exactly the documented OQ-6 fallback, not an improvised
#     workaround. If this project ever gets a real Windows runner, swap this job back to
#     `-p:PublishAot=true` to match `build:linux-x64`.
#
# Both jobs run on the same Docker image; no special runner tags are required beyond whatever
# this project's default runner already picks up.

stages:
  - test
  - build
  - release
  - version-bump

variables:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"

.dotnet_cache: &dotnet_cache
  # GitLab caps cache:key:files at 2 entries, and there's no single NuGet lockfile in this repo to
  # key off of (no RestorePackagesWithLockFile) — Dotquay.sln alone is good enough: a stale key
  # (e.g. only a csproj's package version bumped, not the sln) just means `dotnet restore` adds the
  # newly-needed package into the existing cache dir, not a correctness problem.
  key:
    files:
      - Dotquay.sln
  paths:
    - .nuget/packages/

# Runs once, ahead of both platform-specific publish jobs below — the whole point of Dotquay.Tests
# is that it never touches a real filesystem/network/git/dotnet process (fakes only, see
# docs/SPRINT-01.md), so its result doesn't depend on which OS it runs on and only needs to happen
# once per pipeline rather than being duplicated in each platform build below.
test:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  cache: *dotnet_cache
  script:
    - dotnet restore
    - dotnet test -c Release --logger "console;verbosity=normal"

build:linux-x64:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:10.0
  cache: *dotnet_cache
  before_script:
    # NativeAOT on Linux needs clang (the native code generator's back end) — not present in the
    # base SDK image by default.
    - apt-get update && apt-get install -y --no-install-recommends clang zlib1g-dev
  script:
    - dotnet publish src/Dotquay.Cli -c Release -r linux-x64 --self-contained -p:PublishAot=true -o publish/linux-x64
  artifacts:
    name: "dotquay-linux-x64-$CI_COMMIT_SHORT_SHA"
    paths:
      - publish/linux-x64/dotquay
    expire_in: 30 days

build:windows-x64:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:10.0
  cache: *dotnet_cache
  script:
    # PublishAot explicitly disabled here -- see the file header. Still self-contained + trimmed +
    # single-file, just not natively compiled, since no real Windows build host is available.
    - dotnet publish src/Dotquay.Cli -c Release -r win-x64 --self-contained -p:PublishAot=false -p:PublishTrimmed=true -p:PublishSingleFile=true -o publish/win-x64
  artifacts:
    name: "dotquay-windows-x64-$CI_COMMIT_SHORT_SHA"
    paths:
      - publish/win-x64/dotquay.exe
    expire_in: 30 days

# --- Release: only runs when the pipeline is for a tag (push a tag like `v0.4.0` to trigger it).
# GitLab job artifacts expire (see `expire_in` above) and aren't a stable release-asset URL, so both
# binaries are first uploaded to this project's own Generic Package Registry (a durable, versioned
# file store keyed by package name + version), then the release is created with links pointing at
# those uploaded copies rather than at the job artifacts directly.

upload:linux-x64:
  stage: release
  image: curlimages/curl:8.10.1
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - build:linux-x64
  script:
    - >-
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file publish/linux-x64/dotquay
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/dotquay/${CI_COMMIT_TAG}/dotquay-linux-x64"

upload:windows-x64:
  stage: release
  image: curlimages/curl:8.10.1
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - build:windows-x64
  script:
    - >-
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file publish/win-x64/dotquay.exe
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/dotquay/${CI_COMMIT_TAG}/dotquay-windows-x64.exe"

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: upload:linux-x64
      artifacts: false
    - job: upload:windows-x64
      artifacts: false
  script:
    - echo "Creating release ${CI_COMMIT_TAG}"
  release:
    tag_name: "${CI_COMMIT_TAG}"
    name: "dotquay ${CI_COMMIT_TAG}"
    description: "See docs/SPRINT-01.md and docs/SPEC.md for what shipped in this release."
    assets:
      links:
        - name: "dotquay-linux-x64"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/dotquay/${CI_COMMIT_TAG}/dotquay-linux-x64"
        - name: "dotquay-windows-x64.exe"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/dotquay/${CI_COMMIT_TAG}/dotquay-windows-x64.exe"

# --- Auto version bump: firing a tag (e.g. `v0.4.5`) should immediately push a follow-up commit to
# `main` bumping Dotquay.Cli.csproj's patch version (e.g. to 0.4.6), so any work landing after the
# tag is already developed under the next version number.
#
# `needs: []` deliberately detaches this job from the pipeline's stage ordering: it starts as soon
# as the tag pipeline starts and does NOT wait on test/build/release. Per the request, the version
# must move forward even if the build is broken.
#
# Requires a CI/CD variable `VERSION_BUMP_TOKEN` (Settings > CI/CD > Variables, masked + protected):
# a Project Access Token (or Personal/Group Access Token) with `write_repository` scope, whose role
# is at least Maintainer if `main` is a protected branch. CI_JOB_TOKEN is not used because pushing
# to a protected branch generally requires an explicit access token, not the job token.
bump-version:
  stage: version-bump
  image: alpine/git:2.47.2
  rules:
    - if: $CI_COMMIT_TAG
  needs: []
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  # One literal block for the whole script. Everything inside it is raw text as far as YAML is
  # concerned, so a ": " in a commit message cannot be read as a key/value separator — which is what
  # turned a list item into a mapping and failed the job with "script config should be a string or a
  # nested array of strings".
  #
  # `set -eu` is load-bearing in this shape rather than decoration: a block scalar is a single
  # command to GitLab, so only its *last* line would otherwise decide the job's exit status. Without
  # it a failed fetch or commit reports a green pipeline that bumped nothing. Each entry in the old
  # list form was checked individually, so this preserves that behaviour rather than changing it.
  #
  # The shell also stays alive across the whole block, which is why NEXT no longer has to be handed
  # between steps through a bump.env file.
  script:
    - |
      set -eu

      git config user.email "ci@kemomi.de"
      git config user.name "dotquay-ci"

      git fetch origin main
      git checkout -B main origin/main

      CSPROJ="src/Dotquay.Cli/Dotquay.Cli.csproj"
      CURRENT=$(grep -oE '<Version>[0-9]+\.[0-9]+\.[0-9]+</Version>' "$CSPROJ" | sed -E 's#</?Version>##g')

      if [ -z "$CURRENT" ]; then
        echo "Could not find <Version> in $CSPROJ" >&2
        exit 1
      fi

      MAJOR=$(echo "$CURRENT" | cut -d. -f1)
      MINOR=$(echo "$CURRENT" | cut -d. -f2)
      PATCH=$(echo "$CURRENT" | cut -d. -f3)
      NEXT="$MAJOR.$MINOR.$((PATCH + 1))"

      echo "Tag $CI_COMMIT_TAG triggered version bump: $CURRENT -> $NEXT"
      sed -i "s#<Version>$CURRENT</Version>#<Version>$NEXT</Version>#" "$CSPROJ"

      git add "$CSPROJ"
      git commit -m "chore: bump version to $NEXT [skip ci]"
      git push "https://project-access-token:${VERSION_BUMP_TOKEN}@gitlab.kemomi.de/wild-alliance/dotquay.git" HEAD:main
