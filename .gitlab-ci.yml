# GitLab CI for dotquay (SPEC.md §12: NativeAOT self-contained single-file publish, win-x64 +
# linux-x64; §16 OQ-6: "trimmed self-contained publish only as fallback" where real NativeAOT
# compilation for the target isn't available).
#
# Runner reality (confirmed from a real pipeline run 2026-08-22): this GitLab instance's runner
# (`docker@kemomi.de`) is Docker-executor-only, backed by a Linux host — there is no native
# Windows machine to build on. Native AOT compilation is NOT cross-OS: producing a real win-x64
# native binary requires an actual Windows toolchain (the MSVC/Windows SDK linker), which doesn't
# exist inside a Linux container. So:
#
#   - `build:linux-x64` publishes a genuine NativeAOT binary — host OS == target OS, this is the
#     fully-supported, already-verified-elsewhere path (see docs/SPRINT-01.md's "AOT verdict"
#     sections).
#   - `build:windows-x64` falls back to a trimmed, self-contained, single-file publish
#     (`PublishAot=false`, explicitly overriding the csproj's default) instead of NativeAOT. This
#     is still a fully self-contained single .exe with no separate runtime install needed — just
#     not natively compiled — and it's exactly the documented OQ-6 fallback, not an improvised
#     workaround. If this project ever gets a real Windows runner, swap this job back to
#     `-p:PublishAot=true` to match `build:linux-x64`.
#
# Both jobs run on the same Docker image; no special runner tags are required beyond whatever
# this project's default runner already picks up.
#
# One consequence of that fallback is worth stating where someone will read it, because it is a
# gap in this project's own verification story rather than a detail: **the Windows artifact CI
# produces is not the artifact anyone verifies**. Every hand-verification in this repo runs a real
# AOT win-x64 binary built locally under vcvars (docs/DESIGN-v0.7-AUTH.md onward), while CI ships
# a trimmed one. Trimming and AOT share most failure modes but not all, so a trimming-only
# regression would reach a user unseen. `smoke:linux-x64` closes the equivalent gap on the side
# where CI *can* build the real thing; the Windows side stays uncovered until there is a Windows
# runner, and that is a known, accepted hole rather than an oversight.
#
# Release model (2026-09-11): auto-versioned continuous deployment, matching the vbeami and
# lazy-o-godot pipelines. Every green push to the default branch that changes something shippable
# reserves the next patch version, tags it, and releases it. A human can still cut a specific
# major/minor by pushing a `vX.Y.Z` tag by hand — auto-tag then bumps the patch from *that* tag
# next time. This replaced a `bump-version` job that edited the csproj's `<Version>` after a
# human-pushed tag; CI now stamps the version at publish time instead, so there is no in-tree
# version to keep in step and no follow-up commit per release.

stages:
  - test
  - tag
  - build
  - release

# One pipeline per MR, one per push to a branch with no open MR, plus tags. Without this a branch
# that has an MR open gets two pipelines for every push, which doubles an already slow AOT build.
# auto-tag's own tag push is separately suppressed with `-o ci.skip`, so it never reaches this
# evaluation at all — this is what still lets a *human* pushing a `vX.Y.Z` tag get a normal
# pipeline.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"

.dotnet_cache: &dotnet_cache
  # GitLab caps cache:key:files at 2 entries, and there's no single NuGet lockfile in this repo to
  # key off of (no RestorePackagesWithLockFile) — Dotquay.sln alone is good enough: a stale key
  # (e.g. only a csproj's package version bumped, not the sln) just means `dotnet restore` adds the
  # newly-needed package into the existing cache dir, not a correctness problem.
  key:
    files:
      - Dotquay.sln
  paths:
    - .nuget/packages/

# ---------------------------------------------------------------------------
# shippable-changes — what makes a commit on the default branch a release
# ---------------------------------------------------------------------------
# One list, shared by auto-tag and by everything downstream of it. It used to live only on
# auto-tag, which left the release chain saying merely "on the default branch" — so a push that
# changed nothing shippable skipped auto-tag (correctly) while keeping release:auto, whose
# `needs: auto-tag` is not optional. GitLab then refused to create the pipeline at all:
# "'release:auto' job needs 'auto-tag' job, but 'auto-tag' does not exist in the pipeline."
# The CI-only push in 9c3e5ab is what surfaced it; every earlier push to this branch happened to
# carry a src change alongside. The trigger condition for a release has to be written once and
# used by the whole chain, or the chain disagrees with itself about what a release is.
#
# Deliberately NOT including .gitlab-ci.yml or docs/: editing the pipeline is not shipping a new
# dotquay, and including it would mean every CI tweak burns a version number.
.shippable-changes: &shippable-changes
  - src/**/*

# ---------------------------------------------------------------------------
# Pushing the release tag — why there is no credential dance here
# ---------------------------------------------------------------------------
# auto-tag pushes with the runner's own $CI_JOB_TOKEN, which requires
# Settings > CI/CD > Job token permissions > "Allow Git push requests to the repository"
# to be on for this project (introduced 17.2 behind a flag, GA in 18.4). The token then pushes
# with the permissions of whoever started the pipeline, so a protected default branch and
# protected `v*` tags need no separate role kept in step with them — which is the failure mode
# a dedicated token invites, since nothing tells you it has drifted until a release stops.
#
# This replaced a $VERSION_BUMP_TOKEN Project Access Token and the ~50 lines that existed only to
# make that PAT beat the runner's own credentials. Worth keeping the history, because the shape of
# it is what makes the deleted code look necessary: Runner 15 put the job token in origin's URL, so
# a push to an explicitly written URL matched nothing in .git/config and fell through to the PAT's
# helper. Runner 19 moved that credential into host-keyed git config, which DOES match an
# explicitly written URL — so the job token won, and every release died on "You are not allowed to
# push code to this project" (job 5347). The answer turned out not to be winning that fight but
# ending it: the job token is now the identity that should be pushing.
#
# So do not reintroduce clearing of `credential.helper` or `http.*.extraheader` before a push here.
# The credential that clearing throws away is now precisely the one the push needs.
#
# GitLab triggers no pipeline for a job-token push, which is also what `-o ci.skip` below is for.
# Both are kept: the flag costs nothing and still covers the case where the setting above gets
# turned off, and a second pipeline racing a second publish of the same version is the one thing
# here that must never happen.

# Runs once, ahead of both platform-specific publish jobs below — the whole point of Dotquay.Tests
# is that it never touches a real filesystem/network/git/dotnet process (fakes only, see
# docs/SPRINT-01.md), so its result doesn't depend on which OS it runs on and only needs to happen
# once per pipeline rather than being duplicated in each platform build below.
test:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0-noble
  cache: *dotnet_cache
  script:
    - dotnet restore
    - dotnet test -c Release --logger "console;verbosity=normal"

# ---------------------------------------------------------------------------
# auto-tag — reserve the next release version for this commit, in-pipeline
# ---------------------------------------------------------------------------
# Runs only on an ordinary push to the default branch (not MR pipelines, not tag pipelines —
# $CI_COMMIT_BRANCH is unset for both), and only after `test` passed: a tag created here cascades
# into a real, immutable release later in this same pipeline, and a published version cannot be
# quietly un-shipped.
#
# `changes:` is what stops a README fix from cutting a release. Only `src/**` counts, because that
# is what ends up in the binary. A tests-only commit still runs the suite and simply does not
# release; a docs or CI commit does neither. Deliberately NOT including `.gitlab-ci.yml`: editing
# the pipeline is not shipping a new dotquay, and including it would mean every CI tweak burns a
# version number.
#
# Pushes with $CI_JOB_TOKEN, so this project needs "Allow Git push requests to the repository"
# under Settings > CI/CD > Job token permissions. Without it the push fails with "You are not
# allowed to push code to this project" — see the note above the `test` job for why that message
# used to mean something else entirely.
auto-tag:
  stage: tag
  # alpine/git sets `ENTRYPOINT ["git"]`, so without overriding it the runner's shell invocation
  # becomes `git sh -c "..."` — git tries to run "sh" as a subcommand and fails with "'sh' is not a
  # git command." (confirmed from a real failed run 2026-09-04). The empty entrypoint hands control
  # back to the runner so it can exec the job's own shell script normally.
  #
  # Pinned, unlike the SDK image, because this is the only job in the pipeline that writes to the
  # repository. A silent major bump in git's behaviour belongs nowhere near a job that creates
  # release tags.
  image:
    name: alpine/git:2.47.2
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *shippable-changes
  # No `needs:`, so stage ordering gates this job — `test` must pass first. This is deliberately
  # NOT `needs: []`, which would detach the job from stage ordering entirely and start it
  # immediately, in parallel with the tests it is supposed to be gated on.
  variables:
    # Tags are not fetched by depth, but the walk below needs every release tag that exists, so
    # fetch them explicitly rather than relying on the runner's clone behaviour.
    GIT_DEPTH: "20"
  script:
    - |
      set -eu

      # --prune --prune-tags because the docker executor reuses its build volume between jobs:
      # `git init` and `git clean` both preserve refs, so a tag created by a run whose push then
      # FAILED survives into the next run and becomes the baseline the next version is bumped off.
      # In vbeami three failed releases drifted the next version two patches past anything that
      # ever existed on the remote, exactly that way.
      #
      # --force because pruning only removes tags the remote does NOT have. A failed run's tag can
      # also share its name with one a later run shipped from a different runner slot - each
      # concurrent-N slot keeps its own build volume. In dotquay, job 5347 left v0.18.1 on 75c5ff91 in
      # concurrent-0, job 5360 shipped the real v0.18.1 on 81f0a504 from concurrent-1, and job 6147 back
      # in concurrent-0 then died on "would clobber existing tag". The remote is the only authority on
      # what shipped, so its tags overwrite local ones unconditionally.
      #
      # No --quiet: it suppresses exactly that "! [rejected]" line, so the job exited 1 with nothing in
      # the log at all.
      git fetch origin --tags --force --prune --prune-tags

      LATEST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
      if [ -z "$LATEST_TAG" ]; then LATEST_TAG="v0.0.0"; fi

      # Migration guard, and a decent invariant to keep regardless: never go backwards. This repo
      # switched to auto-versioning with its git tags stopped at v0.4.4 while the csproj's
      # <Version> had been bumped by the old `bump-version` job all the way to 0.9.0 — the two had
      # drifted five minor versions apart. Taking the max means the first auto release continues
      # from what the shipped binary has actually been reporting, and that a hand-edited csproj can
      # never cause a version to be reissued.
      CSPROJ="src/Dotquay.Cli/Dotquay.Cli.csproj"
      CSPROJ_VERSION=$(grep -oE '<Version>[0-9]+\.[0-9]+\.[0-9]+</Version>' "$CSPROJ" | sed -E 's#</?Version>##g' || true)
      BASELINE=$(printf '%s\n%s\n' "${LATEST_TAG#v}" "${CSPROJ_VERSION:-0.0.0}" | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
      echo "latest tag $LATEST_TAG, csproj $CSPROJ_VERSION -> baseline $BASELINE"

      MAJOR="${BASELINE%%.*}"
      REST="${BASELINE#*.}"
      MINOR="${REST%%.*}"
      PATCH="${REST#*.}"
      NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
      NEW_TAG="v$NEXT"
      echo "tagging $CI_COMMIT_SHORT_SHA as $NEW_TAG"

      echo "RELEASE_VERSION=$NEXT" >> release.env
      echo "RELEASE_TAG=$NEW_TAG" >> release.env
    - |
      git tag "$NEW_TAG" "$CI_COMMIT_SHA"

      # `origin`, not an explicitly written URL. The URL used to be the point — it was how a push
      # dodged the job token Runner 15 had embedded in origin's remote. Now the job token is the
      # identity doing the pushing, so the remote the runner set up is exactly the one to use.
      #
      # `-o ci.skip` is load-bearing: without it, pushing a tag spawns a *second*, independent
      # pipeline for the same commit (GitLab treats tag and branch pipelines as unrelated), racing
      # a second release attempt against this one. GitLab already suppresses pipelines for a
      # job-token push, so this is now the second lock on that door rather than the only one.
      git push -o ci.skip origin "refs/tags/$NEW_TAG"
  artifacts:
    reports:
      dotenv: release.env

# ---------------------------------------------------------------------------
# build:* — the publishable artifacts
# ---------------------------------------------------------------------------
# Version is a three-way fallback: a human's $CI_COMMIT_TAG when the pipeline ran because of a
# manual tag, else auto-tag's reserved $RELEASE_VERSION, else a throwaway ci- version so an MR
# still builds. Computed in the script rather than in `variables:`, because GitLab's variable
# expansion does plain $NAME substitution only; the shell parameter-expansion fallback needs a
# real shell.
#
# Both build jobs list `test` in `needs` explicitly. With a `needs:` clause present at all, a job
# no longer waits for earlier *stages* — only for the jobs it names — so omitting `test` here would
# silently let a broken build publish.
.build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:10.0-noble
  cache: *dotnet_cache
  needs:
    - job: test
    - job: auto-tag
      optional: true

build:linux-x64:
  extends: .build
  before_script:
    # NativeAOT on Linux needs clang (the native code generator's back end) — not present in the
    # base SDK image by default.
    - apt-get update && apt-get install -y --no-install-recommends clang zlib1g-dev
  script:
    - |
      set -eu
      # `:-` on the tag: GitLab defines CI_COMMIT_TAG only on tag pipelines, and this script runs
      # under `set -u`, so a branch pipeline otherwise dies with "CI_COMMIT_TAG: unbound variable"
      # before the first line of real work. Strip the leading v as a separate step, because
      # ${CI_COMMIT_TAG:-} and ${CI_COMMIT_TAG#v} cannot be spelled in one expansion.
      PKG_VERSION="${CI_COMMIT_TAG:-}"
      PKG_VERSION="${PKG_VERSION#v}"
      PKG_VERSION="${PKG_VERSION:-${RELEASE_VERSION:-0.0.0-ci-$CI_COMMIT_SHORT_SHA}}"
      echo "building dotquay $PKG_VERSION"
      dotnet publish src/Dotquay.Cli -c Release -r linux-x64 --self-contained -p:PublishAot=true -p:Version="$PKG_VERSION" -o publish/linux-x64

      # Checksum and size, recorded here because here is the only place that has ever seen the bytes
      # this pipeline produced. `dotquay self update` refuses a download that does not match (v0.17,
      # docs/DESIGN-v0.17-SELF-UPDATE.md), which is only worth anything if the expected value comes
      # from the build rather than from the same request as the binary.
      sha256sum publish/linux-x64/dotquay | cut -d' ' -f1 > publish/linux-x64/dotquay.sha256
      stat -c%s publish/linux-x64/dotquay > publish/linux-x64/dotquay.size
      cat publish/linux-x64/dotquay.sha256
  artifacts:
    name: "dotquay-linux-x64-$CI_COMMIT_SHORT_SHA"
    paths:
      - publish/linux-x64/dotquay
      - publish/linux-x64/dotquay.sha256
      - publish/linux-x64/dotquay.size
    expire_in: 30 days

build:windows-x64:
  extends: .build
  script:
    - |
      set -eu
      # `:-` on the tag: GitLab defines CI_COMMIT_TAG only on tag pipelines, and this script runs
      # under `set -u`, so a branch pipeline otherwise dies with "CI_COMMIT_TAG: unbound variable"
      # before the first line of real work. Strip the leading v as a separate step, because
      # ${CI_COMMIT_TAG:-} and ${CI_COMMIT_TAG#v} cannot be spelled in one expansion.
      PKG_VERSION="${CI_COMMIT_TAG:-}"
      PKG_VERSION="${PKG_VERSION#v}"
      PKG_VERSION="${PKG_VERSION:-${RELEASE_VERSION:-0.0.0-ci-$CI_COMMIT_SHORT_SHA}}"
      echo "building dotquay $PKG_VERSION"
      # PublishAot explicitly disabled here -- see the file header. Still self-contained + trimmed +
      # single-file, just not natively compiled, since no real Windows build host is available.
      dotnet publish src/Dotquay.Cli -c Release -r win-x64 --self-contained -p:PublishAot=false -p:PublishTrimmed=true -p:PublishSingleFile=true -p:Version="$PKG_VERSION" -o publish/win-x64

      sha256sum publish/win-x64/dotquay.exe | cut -d' ' -f1 > publish/win-x64/dotquay.exe.sha256
      stat -c%s publish/win-x64/dotquay.exe > publish/win-x64/dotquay.exe.size
      cat publish/win-x64/dotquay.exe.sha256
  artifacts:
    name: "dotquay-windows-x64-$CI_COMMIT_SHORT_SHA"
    paths:
      - publish/win-x64/dotquay.exe
      - publish/win-x64/dotquay.exe.sha256
      - publish/win-x64/dotquay.exe.size
    expire_in: 30 days

# ---------------------------------------------------------------------------
# smoke:linux-x64 — run the binary this pipeline is about to ship
# ---------------------------------------------------------------------------
# This project's standing rule is that a green `dotnet build`/`dotnet test` is not evidence a
# NativeAOT-published binary works: the trimmer strips reflection metadata a library needs without
# the analyzer catching it, which has broken Spectre.Console.Cli, NuGet.Protocol, and a `--json`
# payload outright in this repo's history — every one of them invisible until the real binary was
# run by hand. Until now CI built those binaries and never executed one, so the rule was enforced
# entirely by someone remembering.
#
# Run against `runtime-deps`, not the SDK image, and with GIT_STRATEGY none: a NativeAOT binary
# must run with nothing but the native prerequisites and no source tree. Smoking it inside the SDK
# image would hide a publish that had quietly stopped being self-contained.
#
# The `--json` calls are the checks that matter. A payload missing from DotquayJsonContext builds
# clean, passes the entire test suite, and fails only in the published binary — so asserting that
# an envelope actually comes out is the one thing no unit test can do.
smoke:linux-x64:
  stage: build
  image: mcr.microsoft.com/dotnet/runtime-deps:10.0-noble
  needs:
    - job: build:linux-x64
  variables:
    GIT_STRATEGY: none
  script:
    - |
      set -eu

      BIN="$CI_PROJECT_DIR/publish/linux-x64/dotquay"
      chmod +x "$BIN"

      echo "--- it starts, and reports a version"
      "$BIN" --version
      "$BIN" --version | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+' \
        || { echo "FAIL: --version did not print a version"; exit 1; }

      echo "--- System.CommandLine's help renders (the Spectre.Console.Cli failure shape)"
      "$BIN" --help > /dev/null

      echo "--- it can scaffold a project"
      mkdir -p /tmp/smoke
      "$BIN" init --project /tmp/smoke
      test -f /tmp/smoke/dotquay.toml || { echo "FAIL: init wrote no manifest"; exit 1; }

      echo "--- the --json envelopes serialize under AOT"
      OUT=$("$BIN" source list --json --project /tmp/smoke)
      echo "$OUT"
      echo "$OUT" | grep -q '"command":"source-list"' \
        || { echo "FAIL: source list --json emitted no envelope"; exit 1; }
      echo "$OUT" | grep -q '"ok":true' \
        || { echo "FAIL: source list --json reported a failure"; exit 1; }

      OUT=$("$BIN" list --json --project /tmp/smoke)
      echo "$OUT"
      echo "$OUT" | grep -q '"command":"list"' \
        || { echo "FAIL: list --json emitted no envelope"; exit 1; }

      # doctor exits non-zero when it finds issues, and it will: there is no git in this image, no
      # .csproj, and nothing installed. That is fine and is itself worth exercising — what must not
      # happen is a stack trace instead of an envelope, which is exactly how an AOT serialization
      # failure surfaces to the editor plugin.
      OUT=$("$BIN" doctor --json --project /tmp/smoke || true)
      echo "$OUT"
      echo "$OUT" | grep -q '"command":"doctor"' \
        || { echo "FAIL: doctor --json emitted no envelope"; exit 1; }

      # `ok` and `healthy` answer different questions, and the editor plugin depends on the
      # difference: `ok` is false exactly when the envelope carries an `error` (JsonEnvelope.cs),
      # while an unhealthy project is *data* — issues are a finding, not a crash. Only the exit code
      # says "something is wrong", which is why this call needs the `|| true` above. The invariant is
      # documented in three places (JsonEnvelope.cs, DoctorCommand.cs, DotquayDoctorTool.cs) and
      # until now was asserted in none: DependencyWorkflowTests covers IsHealthy thoroughly, but
      # nothing covered the shape that actually reaches the plugin. This job is the right place for
      # it — a real AOT binary in a guaranteed-unhealthy state, since the image has no git.
      echo "$OUT" | grep -q '"ok":true' \
        || { echo "FAIL: doctor --json reported the command itself as failed"; exit 1; }
      echo "$OUT" | grep -q '"healthy":false' \
        || { echo "FAIL: doctor --json did not report the unhealthy project"; exit 1; }

      echo "--- 'self check' answers with an envelope rather than a stack trace"
      # The release channel is a private project and this job holds no credential for it, so the
      # expected outcome is an auth failure - and that is still the assertion worth making. An
      # AOT serialization bug in the new payload surfaces as *no envelope at all*, which is exactly
      # what the editor plugin cannot cope with (SPEC.md 17). Whether the success payload
      # serializes is verified by hand against a real AOT binary with a credential; CI cannot see it.
      OUT=$("$BIN" self check --json || true)
      echo "$OUT"
      echo "$OUT" | grep -q '"command":"self-check"' \
        || { echo "FAIL: self check --json emitted no envelope"; exit 1; }
      if echo "$OUT" | grep -q '\"ok\":true'; then
        echo "$OUT" | grep -q '"current_version"' \
          || { echo "FAIL: a successful self check --json carried no payload"; exit 1; }
      fi

      echo "--- 'self update' refuses politely rather than crashing"
      OUT=$("$BIN" self update --dry-run --json || true)
      echo "$OUT"
      echo "$OUT" | grep -q '"command":"self-update"' \
        || { echo "FAIL: self update --json emitted no envelope"; exit 1; }

      echo "--- the published binary is good"

# ---------------------------------------------------------------------------
# release — durable copies, then the GitLab Release
# ---------------------------------------------------------------------------
# GitLab job artifacts expire (see `expire_in` above) and aren't a stable release-asset URL, so both
# binaries are first uploaded to this project's own Generic Package Registry (a durable, versioned
# file store keyed by package name + version), then the release is created with links pointing at
# those uploaded copies rather than at the job artifacts directly.
#
# Every job below runs on both release paths — a human `vX.Y.Z` tag, and auto-tag's reserved
# version on the default branch — and resolves the version the same way the build jobs do.
.upload:
  stage: release
  image: curlimages/curl:8.10.1
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *shippable-changes

upload:linux-x64:
  extends: .upload
  needs:
    - job: auto-tag
      optional: true
    - job: build:linux-x64
    # The smoke job gates the upload, not just the build. Publishing a binary that does not start
    # is the one outcome worth making structurally impossible.
    - job: smoke:linux-x64
      artifacts: false
  script:
    - |
      set -eu
      # `:-` on both, under `set -u`: CI_COMMIT_TAG exists only on tag pipelines and
      # RELEASE_VERSION only when auto-tag ran. The guard below is what turns "neither" into a
      # sentence; without the defaults it would never be reached.
      PKG_VERSION="${CI_COMMIT_TAG:-}"
      PKG_VERSION="${PKG_VERSION#v}"
      PKG_VERSION="${PKG_VERSION:-${RELEASE_VERSION:-}}"
      test -n "$PKG_VERSION" || { echo "FAIL: no version to release" >&2; exit 1; }
      echo "uploading dotquay $PKG_VERSION (linux-x64)"
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file publish/linux-x64/dotquay \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/dotquay/${PKG_VERSION}/dotquay-linux-x64"
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file publish/linux-x64/dotquay.sha256 \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/dotquay/${PKG_VERSION}/dotquay-linux-x64.sha256"

upload:windows-x64:
  extends: .upload
  needs:
    - job: auto-tag
      optional: true
    - job: build:windows-x64
  script:
    - |
      set -eu
      # `:-` on both, under `set -u`: CI_COMMIT_TAG exists only on tag pipelines and
      # RELEASE_VERSION only when auto-tag ran. The guard below is what turns "neither" into a
      # sentence; without the defaults it would never be reached.
      PKG_VERSION="${CI_COMMIT_TAG:-}"
      PKG_VERSION="${PKG_VERSION#v}"
      PKG_VERSION="${PKG_VERSION:-${RELEASE_VERSION:-}}"
      test -n "$PKG_VERSION" || { echo "FAIL: no version to release" >&2; exit 1; }
      echo "uploading dotquay $PKG_VERSION (windows-x64)"
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file publish/win-x64/dotquay.exe \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/dotquay/${PKG_VERSION}/dotquay-windows-x64.exe"
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file publish/win-x64/dotquay.exe.sha256 \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/dotquay/${PKG_VERSION}/dotquay-windows-x64.exe.sha256"

# ---------------------------------------------------------------------------
# upload:manifest -- the one document `dotquay self update` reads
# ---------------------------------------------------------------------------
# One immutable document per version, naming every published binary and what it should hash to. It
# is what lets a self-update answer "what is newest, for my platform, and is this really it" in one
# round trip, and it cannot disagree with itself the way a binary and a separately-fetched checksum
# can.
#
# Uploaded last, and needing both upload jobs rather than just both builds: the URLs it names must
# already resolve by the time anything reads it. There is deliberately no mutable `latest.json` -
# "what is newest" is answered by the releases API, which is already the authority on what shipped,
# and a mutable document would be one more thing for two concurrent publishes to race.
upload:manifest:
  extends: .upload
  needs:
    - job: auto-tag
      optional: true
    - job: build:linux-x64
    - job: build:windows-x64
    - job: upload:linux-x64
      artifacts: false
    - job: upload:windows-x64
      artifacts: false
  script:
    - |
      set -eu
      # `:-` on both, under `set -u`: CI_COMMIT_TAG exists only on tag pipelines and
      # RELEASE_VERSION only when auto-tag ran. The guard below is what turns "neither" into a
      # sentence; without the defaults it would never be reached.
      PKG_VERSION="${CI_COMMIT_TAG:-}"
      PKG_VERSION="${PKG_VERSION#v}"
      PKG_VERSION="${PKG_VERSION:-${RELEASE_VERSION:-}}"
      test -n "$PKG_VERSION" || { echo "FAIL: no version to describe" >&2; exit 1; }

      BASE="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/dotquay/${PKG_VERSION}"

      # printf rather than a heredoc: a heredoc's terminator has to survive YAML block-scalar
      # indentation stripping to land in column 0, and a pipeline that breaks on a whitespace edit
      # is a pipeline that will break on a whitespace edit.
      printf '{"schema":1,"version":"%s","released_at":"%s","assets":[{"rid":"linux-x64","file_name":"dotquay-linux-x64","url":"%s/dotquay-linux-x64","sha256":"%s","size":%s},{"rid":"win-x64","file_name":"dotquay-windows-x64.exe","url":"%s/dotquay-windows-x64.exe","sha256":"%s","size":%s}]}' \
        "$PKG_VERSION" \
        "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        "$BASE" "$(cat publish/linux-x64/dotquay.sha256)" "$(cat publish/linux-x64/dotquay.size)" \
        "$BASE" "$(cat publish/win-x64/dotquay.exe.sha256)" "$(cat publish/win-x64/dotquay.exe.size)" \
        > manifest.json

      cat manifest.json
      echo

      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file manifest.json \
        "$BASE/manifest.json"

# Two release jobs with disjoint rules rather than one, because `release:tag_name` is expanded as a
# CI variable and cannot take the shell fallback the upload jobs use for PKG_VERSION. A
# human-pushed tag and auto-tag's reserved version arrive by different routes, so each job states
# the spelling it can know statically.
.release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  variables:
    GIT_STRATEGY: none
  script:
    - echo "creating a GitLab Release for $RELEASE_FOR"

release:tagged:
  extends: .release
  needs:
    - job: upload:linux-x64
      artifacts: false
    - job: upload:windows-x64
      artifacts: false
    - job: upload:manifest
      artifacts: false
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  variables:
    RELEASE_FOR: $CI_COMMIT_TAG
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "dotquay $CI_COMMIT_TAG"
    description: "See docs/SPEC.md and the DESIGN-v0.*.md files for what shipped in this release."
    assets:
      links:
        - name: "dotquay-linux-x64"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/dotquay/${CI_COMMIT_TAG}/dotquay-linux-x64"
        - name: "dotquay-windows-x64.exe"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/dotquay/${CI_COMMIT_TAG}/dotquay-windows-x64.exe"
        # The link `dotquay self update` looks for by name. Without it a release is invisible to the
        # self-updater, which reports "publishes no binaries at all" rather than guessing at URLs.
        - name: "manifest.json"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/dotquay/${CI_COMMIT_TAG}/manifest.json"
        - name: "dotquay-linux-x64.sha256"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/dotquay/${CI_COMMIT_TAG}/dotquay-linux-x64.sha256"
        - name: "dotquay-windows-x64.exe.sha256"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/dotquay/${CI_COMMIT_TAG}/dotquay-windows-x64.exe.sha256"

release:auto:
  extends: .release
  # auto-tag is NOT optional here, unlike in the upload jobs: this job only runs on the default
  # branch, which is exactly the case where auto-tag ran. Its dotenv is the only source of
  # RELEASE_TAG.
  needs:
    - job: auto-tag
    - job: upload:linux-x64
      artifacts: false
    - job: upload:windows-x64
      artifacts: false
    - job: upload:manifest
      artifacts: false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *shippable-changes
  variables:
    RELEASE_FOR: $RELEASE_TAG
  release:
    tag_name: "$RELEASE_TAG"
    name: "dotquay $RELEASE_TAG"
    description: "See docs/SPEC.md and the DESIGN-v0.*.md files for what shipped in this release."
    assets:
      links:
        - name: "dotquay-linux-x64"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/dotquay/${RELEASE_VERSION}/dotquay-linux-x64"
        - name: "dotquay-windows-x64.exe"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/dotquay/${RELEASE_VERSION}/dotquay-windows-x64.exe"
        - name: "manifest.json"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/dotquay/${RELEASE_VERSION}/manifest.json"
        - name: "dotquay-linux-x64.sha256"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/dotquay/${RELEASE_VERSION}/dotquay-linux-x64.sha256"
        - name: "dotquay-windows-x64.exe.sha256"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/dotquay/${RELEASE_VERSION}/dotquay-windows-x64.exe.sha256"
