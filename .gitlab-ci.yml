# GitLab CI for dependi (SPEC.md §12: NativeAOT self-contained single-file publish, win-x64 +
# linux-x64). Two independent build jobs, one per target OS, because NativeAOT compilation is not
# cross-platform: the linker/toolchain that turns IL into a native binary has to run on (or at
# least be fully provisioned for) the OS it's compiling for. See docs/SPRINT-01.md's "AOT verdict"
# sections for why this project treats "builds clean" and "the published binary actually runs" as
# two separate, both-required facts.
#
# Runner prerequisites (adjust the `tags:` below to match your actual GitLab Runner setup):
#   - A Linux runner (Docker executor is fine — this job pulls the .NET SDK image itself), tagged
#     `linux` below.
#   - A Windows runner with a Windows shell executor (native Windows OS, not a Linux container —
#     NativeAOT's Windows path needs the MSVC/Windows SDK linker, which only exists on real
#     Windows) with the .NET 10 SDK and the "Desktop development with C++" Visual Studio Build
#     Tools workload already installed, tagged `windows` below.

stages:
  - test
  - build

variables:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"

# Runs once, on Linux, ahead of both platform-specific publish jobs — the whole point of Dependi.Tests
# is that it never touches a real filesystem/network/git/dotnet process (fakes only, see
# docs/SPRINT-01.md), so its result doesn't depend on which OS it runs on and only needs to happen
# once per pipeline rather than being duplicated in each platform build below.
test:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  tags:
    - linux
  cache:
    # GitLab caps cache:key:files at 2 entries, and there's no single NuGet lockfile in this repo
    # to key off of (no RestorePackagesWithLockFile) — Dependi.sln alone is good enough: a stale key
    # (e.g. only a csproj's package version bumped, not the sln) just means `dotnet restore` adds
    # the newly-needed package into the existing cache dir, not a correctness problem.
    key:
      files:
        - Dependi.sln
    paths:
      - .nuget/packages/
  script:
    - dotnet restore
    - dotnet test -c Release --logger "console;verbosity=normal"

build:linux-x64:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:10.0
  tags:
    - linux
  cache:
    key:
      files:
        - Dependi.sln
    paths:
      - .nuget/packages/
  before_script:
    # NativeAOT on Linux needs clang (the native code generator's back end) — not present in the
    # base SDK image by default.
    - apt-get update && apt-get install -y --no-install-recommends clang zlib1g-dev
  script:
    - dotnet publish src/Dependi.Cli -c Release -r linux-x64 --self-contained -p:PublishAot=true -o publish/linux-x64
  artifacts:
    name: "dependi-linux-x64-$CI_COMMIT_SHORT_SHA"
    paths:
      - publish/linux-x64/dependi
    expire_in: 30 days

build:windows-x64:
  stage: build
  tags:
    - windows
  cache:
    key:
      files:
        - Dependi.sln
    paths:
      - .nuget\packages\
  script:
    - dotnet publish src\Dependi.Cli -c Release -r win-x64 --self-contained -p:PublishAot=true -o publish\win-x64
  artifacts:
    name: "dependi-windows-x64-$CI_COMMIT_SHORT_SHA"
    paths:
      - publish\win-x64\dependi.exe
    expire_in: 30 days
